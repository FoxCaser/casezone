<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CaseZone</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <div class="logo">
    CASE<span>ZONE</span>
  </div>

  <div class="account">
    <span id="userLabel">Гість</span>
    <span id="balance">0 ₴</span>
    <button id="depositBtn" class="deposit-btn">
  ＋ Поповнити
</button>

    <button id="authBtn">
      Увійти
    </button>
    <button id="profileBtn" class="profile-btn">
  👤 Профіль
</button>
  </div>
</header>

<main>

  <section class="hero">
    <div>
      <div class="eyebrow">
        CS2 CASE OPENING
      </div>

      <h1>
        ВІДКРИВАЙ.<br>
        <span>ВИГРАВАЙ.</span>
      </h1>

      <p class="sub">
        Відкривай кейси, отримуй скіни та збирай власний інвентар.
      </p>
    </div>
  </section>

  <section>

    <div class="section-title">
      <h2>Кейси</h2>

      <button
        class="ghost"
        id="inventoryBtn">
        🎒 Інвентар
      </button>
    </div>
    
     <div class="case-filters">

  <button class="filter active" onclick="filterCases('all')">
    Усі
  </button>

  <button class="filter" onclick="filterCases('cheap')">
    💰 Дешеві
  </button>

  <button class="filter" onclick="filterCases('premium')">
    💎 Преміум
  </button>

  <button class="filter" onclick="filterCases('expensive')">
    🔥 Дорогі
  </button>

</div>

<div
  id="cases"
  class="grid">
</div>

  </section>

</main>

<div
  id="inventory"
  class="modal hidden">

  <div class="modal-card">

    <button
      id="closeInv"
      class="x">
      ×
    </button>

    <h2>🎒 Мій інвентар</h2>

    <div
      id="items"
      class="inventory">
    </div>

  </div>
</div>
<!-- =========================
     ПРОФІЛЬ
========================= -->

<div id="profileModal" class="modal hidden">

  <div class="modal-card profile-card">

    <button
      id="closeProfile"
      class="x">
      ×
    </button>

    <h2>👤 Профіль</h2>

    <div class="profile-layout">

      <div class="profile-menu">

        <button
          class="profile-tab active"
          data-tab="settings">
          ⚙️ Налаштування
        </button>

        <button
          class="profile-tab"
          data-tab="deposits">
          💳 Історія поповнень
        </button>

        <button
          class="profile-tab"
          data-tab="withdrawals">
          📦 Історія виводу
        </button>

      </div>


      <div class="profile-content">

        <!-- НАЛАШТУВАННЯ -->

        <div
          id="profileSettings"
          class="profile-section">

          <h3>Налаштування</h3>

          <label for="steamTradeUrl">
            Steam Trade URL
          </label>

          <input
            id="steamTradeUrl"
            type="text"
            placeholder="https://steamcommunity.com/tradeoffer/new/?partner=..."
          >

          <button
            id="saveTradeUrl"
            class="deposit-btn">
            Зберегти
          </button>

          <p id="tradeUrlStatus"></p>

        </div>


        <!-- ІСТОРІЯ ПОПОВНЕНЬ -->

        <div
          id="profileDeposits"
          class="profile-section hidden">

          <h3>Історія поповнень</h3>

          <div id="depositHistory">
            Історія поповнень порожня
          </div>

        </div>


        <!-- ІСТОРІЯ ВИВОДУ -->

        <div
          id="profileWithdrawals"
          class="profile-section hidden">

          <h3>Історія виводу скінів</h3>

          <div id="withdrawHistory">
            Історія виводу порожня
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
<div
  id="modal"
  class="modal hidden">

  <div class="modal-card">

    <button
      id="closeModal"
      class="x">
      ×
    </button>

    <div id="modalContent"></div>

</div>
</div>

<div id="depositModal" class="modal hidden">

  <div class="modal-card">

    <button id="closeDeposit" class="x">
      ×
    </button>

    <h2>💰 Поповнення балансу</h2>

   

    <div id="depositInfo"></div>

  </div>

</div>

<script src="/app.js"></script>
