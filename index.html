<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CaseZone</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <div class="logo">
    CASE<span>ZONE</span>
  </div>

  <div class="account">
    <span id="userLabel">Гість</span>
    <span id="balance">0 ₴</span>

    <button id="authBtn">
      Увійти
    </button>
  </div>
</header>

<main>

  <section class="hero">
    <div>
      <div class="eyebrow">
        CS2 CASE OPENING
      </div>

      <h1>
        ВІДКРИВАЙ.<br>
        <span>ВИГРАВАЙ.</span>
      </h1>

      <p class="sub">
        Відкривай кейси, отримуй скіни та збирай власний інвентар.
      </p>
    </div>
  </section>

  <section>

    <div class="section-title">
      <h2>Кейси</h2>

      <button
        class="ghost"
        id="inventoryBtn">
        🎒 Інвентар
      </button>
    </div>
    
     <div class="case-filters">

  <button class="filter active" onclick="filterCases('all')">
    Усі
  </button>

  <button class="filter" onclick="filterCases('cheap')">
    💰 Дешеві
  </button>

  <button class="filter" onclick="filterCases('premium')">
    💎 Преміум
  </button>

  <button class="filter" onclick="filterCases('expensive')">
    🔥 Дорогі
  </button>

</div>

<div
  id="cases"
  class="grid">
</div>

      id="cases"
      class="grid">
    </div>

  </section>

</main>

<div
  id="inventory"
  class="modal hidden">

  <div class="modal-card">

    <button
      id="closeInv"
      class="x">
      ×
    </button>

    <h2>🎒 Мій інвентар</h2>

    <div
      id="items"
      class="inventory">
    </div>

  </div>
</div>

<div
  id="modal"
  class="modal hidden">

  <div class="modal-card">

    <button
      id="closeModal"
      class="x">
      ×
    </button>

    <div id="modalContent"></div>

  </div>
</div>

<script src="/app.js"></script>

</body>
</html>
