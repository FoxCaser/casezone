<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaseZone</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="logo">CASE<span>ZONE</span></div>
  <div class="account">
    <span id="userLabel">Гість</span>
    <b id="balance">0 ₴</b>
    <button id="authBtn">Увійти</button>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <p class="eyebrow">CS2 CASE OPENING</p>
      <h1>Відкрий свій<br><span>легендарний</span> дроп</h1>
      <p class="sub">Красиві анімації, серверний рандом і справжній інвентар.</p>
    </div>
  </section>

  <section>
    <div class="section-title"><h2>Кейси</h2><button id="inventoryBtn" class="ghost">Інвентар</button></div>
    <div id="cases" class="grid"></div>
  </section>

  <section id="inventory" class="panel hidden">
    <div class="section-title"><h2>Твій інвентар</h2><button id="closeInv" class="ghost">Закрити</button></div>
    <div id="items" class="inventory"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="x" id="closeModal">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
