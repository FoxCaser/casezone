<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CaseZone Admin</title>

  <style>
    body{
      margin:0;
      padding:30px;
      background:#080b10;
      color:#fff;
      font-family:Arial,sans-serif;
    }

    h1{
      margin-bottom:25px;
    }

    .request{
      background:#11161e;
      border:1px solid #293342;
      border-radius:14px;
      padding:20px;
      margin-bottom:15px;
    }

    .request h2{
      margin:0 0 12px;
    }

    .info{
      color:#aaa;
      margin:6px 0;
    }

    .status{
      display:inline-block;
      padding:6px 10px;
      border-radius:7px;
      background:#3b2d00;
      color:#ffd700;
      margin:10px 0;
    }

    button{
      border:0;
      border-radius:8px;
      padding:10px 18px;
      margin-right:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .give{
      background:#ff9f1c;
      color:#000;
    }

    .reject{
      background:#333b48;
      color:#fff;
    }

    .empty{
      color:#888;
    }
  </style>
</head>

<body>

<h1>CASEZONE ADMIN</h1>

<div id="requests">
  Завантаження заявок...
</div>

<script>

async function loadRequests(){

  const response = await fetch("/api/withdrawals");

  if(!response.ok){
    const text = await response.text();

    document.querySelector("#requests").innerHTML =
      "<p>Помилка доступу: " + text + "</p>";

    return;
  }

  const requests = await response.json();

  if(!requests.length){
    document.querySelector("#requests").innerHTML =
      '<p class="empty">Заявок немає.</p>';

    return;
  }

  document.querySelector("#requests").innerHTML =
    requests.map(x => `

      <div class="request">

        <h2>Заявка #${x.id}</h2>

        <div class="info">
          Скін: <b>${x.item_name}</b>
        </div>

        <div class="info">
          SteamID: ${x.steam_id}
        </div>

        <div class="info">
          Вартість: ${x.value} ₴
        </div>

        <div class="status">
          ${x.status}
        </div>

        <br>

        <button
          class="give"
          onclick="alert('Поки що реальна передача Steam не підключена')">
          🎁 Видати
        </button>

        <button
          class="reject"
          onclick="alert('Відхилення поки не підключене')">
          ❌ Відхилити
        </button>

      </div>

    `).join("");
}

loadRequests();

</script>

</body>
</html>
